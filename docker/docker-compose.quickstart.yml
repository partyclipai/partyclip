services:
  paperclip:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "${PARTYCLIP_PORT:-3100}:3100"
    environment:
      HOST: "0.0.0.0"
      PARTYCLIP_HOME: "/partyclip"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      PARTYCLIP_DEPLOYMENT_MODE: "authenticated"
      PARTYCLIP_DEPLOYMENT_EXPOSURE: "private"
      PARTYCLIP_PUBLIC_URL: "${PARTYCLIP_PUBLIC_URL:-http://localhost:3100}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
    volumes:
      - "${PARTYCLIP_DATA_DIR:-../data/docker-paperclip}:/partyclip"
